[project]
name = "financial-db"
version = "0.1.0"
description = "Personal financial data management system with PostgreSQL"
requires-python = ">=3.9"
dependencies = [
    "jupyterlab",
    "pandas",
    "pandas-datareader",
    "matplotlib",
    "numpy",
    "psycopg2-binary",
    "requests",
    "scikit-learn",
    "seaborn",
    "xlrd",
    "yfinance",
    "sqlalchemy",
]

[project.dependency-groups.dev]
dependencies = [
    "pytest>=8.4.2",
    "pytest-postgresql",
    "psycopg[binary]",
]

[tool.pytest.ini_options]
markers = [
    "integration: mark tests as integration tests",
]
