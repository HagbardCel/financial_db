[project]
name = "financial-db"
version = "0.1.0"
description = "Personal financial data management system with PostgreSQL"
requires-python = ">=3.9"
dependencies = [
    "pandas",
    "numpy",
    "psycopg2-binary",
    "requests",
    "xlrd",
    "openbb==4.6.0; python_version >= '3.10'",
    "openbb==4.1.3; python_version < '3.10'",
    "sqlalchemy",
]

[tool.uv]
package = true
default-groups = ["dev", "analysis"]

[dependency-groups]
dashboard = [
    "streamlit",
    "matplotlib",
    "seaborn",
]
analysis = [
    "jupyterlab",
    "scikit-learn",
    "matplotlib",
    "seaborn",
]
dev = [
    "pytest>=8.4.2",
    "pytest-postgresql",
    "psycopg[binary]",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["db_utils*", "data_fetchers*", "dashboard*", "analyses*"]

[tool.pytest.ini_options]
markers = [
    "integration: mark tests as integration tests",
]
